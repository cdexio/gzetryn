# gzetryn tunables. Copy to config/gzetryn.yaml (git-ignored, kept by deploy) and change only what you need;
# every key is optional and defaults to the value shown. All numbers are [TUNABLE] (spec §12) unless measured.

budget:                   # spec §10 (revised 2026-10-05): per path group, strict priority
  per_minute: 60          # global cap on GMGN requests/min
  burst: 15
  min_gap_sec: 0.25
  groups:                 # Cloudflare challenges per path prefix (/vas/ blocked while /api/, /defi/ answered)
    # D-2026-10-05-14: intel first — P2/P3 leave 4 tokens (one survivor's 4 vas calls), P0 starts 0.25 s apart
    vas: {per_minute: 12, burst: 5, min_gap_sec: 1.0, p0_min_gap_sec: 0.25, reserve: {P0: 0, P1: 0, P2: 4, P3: 4}}
    api: {per_minute: 30, burst: 8, min_gap_sec: 0.3}
    defi: {per_minute: 20, burst: 6, min_gap_sec: 0.3}
    mrwapi: {per_minute: 20, burst: 6, min_gap_sec: 0.3}
    launchlab: {per_minute: 20, burst: 3, min_gap_sec: 1.0}  # not GMGN: Raydium LaunchLab list API
    dextools: {per_minute: 20, burst: 3, min_gap_sec: 2.0}   # not GMGN: DEXTools pair page (snipers part)
  # P0 engine token intel, P1 other API + chain enrichment, P2 pump lists, P3 wallet sweep + background;
  # tokens each leaves free in its group (a group's own `reserve` replaces this)
  reserve: {P0: 0, P1: 0, P2: 1, P3: 2}
  max_wait_sec: {P0: 3, P1: 30, P2: 60, P3: 120}  # P0 3 s: the engine aborts intel after 4 s
  p0_global_gap_sec: 0.05
  cooldown_start_sec: 15  # per group after a 429/403; doubles on every consecutive throttle; one probe afterwards
  cooldown_max_sec: 3600  # /vas/ blocks outlast 300 s; reset by the first success
  cooldown_decay_sec: 900 # after a success: ladder steps down one level per 15 clean min (no reset)
  reopen_slow_sec: 600    # after a reopen: half rate (reopen_rate_factor) for 10 min
  reopen_rate_factor: 0.5
  global_pause_groups: 2  # global pause only when this many groups cool at once
  global_pause_sec: 60

pump_chain:               # pump.fun completing/migrated from the chain (spec §7.2), on the trigger's WS connection
  enabled: true
  completing_min_progress: 0.55  # GMGN's completing list spanned 0.5477-1.0 (113 rows)
  update_sec: 30          # at most one `last` refresh per mint
  flush_sec: 1
  migrated: true

launchlab:                # Raydium LaunchLab lists (spec §7.3); rate line budget.groups.launchlab
  enabled: true
  new_sec: 15
  last_trade_sec: 30
  completing_min_rate: 25 # Raydium finishingRate percent (100 at migration), not token-based progress

candidates:               # engine candidate source (spec §7.1)
  pump_sec: 30
  pump_skip_when_chain_healthy: true  # D-2026-10-05-14: no /vas/ pump lists while the pump.fun chain source delivers
  pump_chain_max_idle_sec: 120
  new_pairs_sec: 30
  trending_sec: 60
  retention_days: 7

rank:
  interval_sec: 3600
  tags: [kol, smart_degen]
  periods: [7d, 30d]

curation:                 # owner decision 2026-10-03 ("recommended")
  interval_sec: 86400
  top_n: 50
  tags: [kol, smart_degen]
  min_profit_30d_usd: 0   # realized_profit_30d > this
  min_pnl_30d: 0          # pnl_30d (ROI ratio) > this
  min_winrate_30d: 0.50   # >=
  max_trades_per_day: 150 # (buy_30d + sell_30d) / 30 <= this
  min_trades_30d: 20      # buy_30d + sell_30d >= this (owner 2026-10-03)
  min_candidates: 50      # fewer → run skipped

tagged:                   # phase 14, D-2026-10-05-15: watch-only GMGN-tagged wallets for the tag_buyers part
  enabled: true
  tags: [kol, smart_degen, renowned]
  max_trades_per_day: 150 # same bot filter as the curation
  max_wallets: 200
  per_connection: 85      # public WS closes a connection at its 100th subscription attempt (probed 2026-10-05)
  buyers_window_min: 30

directory:
  manual_metrics_sec: 21600

watch:
  hot_window_sec: 1800
  warm_window_sec: 86400
  hot_interval_sec: 45          # while the on-chain trigger is down
  warm_interval_sec: 90
  cold_interval_sec: 300
  fallback_hot_interval_sec: 120  # while the trigger is healthy (it only catches misses)
  fallback_warm_interval_sec: 300
  fallback_cold_interval_sec: 900
  sweep_hot_interval_sec: 900     # chain first (trigger.chain_first): GMGN only sweeps for what the chain misses
  sweep_warm_interval_sec: 1800
  sweep_cold_interval_sec: 3600
  sweep_first_spread_sec: 900
  miss_poll_sec: 60               # a notified swap the decoder could not fetch → sweep that wallet this soon

trigger:                  # on-chain trigger (spec §6.1); free public endpoint, verified 2026-10-03
  enabled: true
  ws_url: wss://api.mainnet-beta.solana.com
  commitment: confirmed
  debounce_sec: 1
  retry_delays_sec: [2, 4]  # polls at +1, +3, +7 s (95.4% of trigger events lag <= 5 s)
  max_wait_sec: 10
  max_concurrent: 2         # triggered polls in flight (separate from interval polls)
  chain_fallback: true      # chain decoder for notified swaps (spec §6.2)
  chain_first: true         # D-2026-10-05-14: every notified swap is decoded from the chain, no GMGN trigger poll
  rpc_endpoints:            # free public RPCs, soonest free one first, each paced on its own
    - {url: https://solana-rpc.publicnode.com, min_gap_sec: 0.5}   # 300/300 at 0.5 s over 160 s (2026-10-05)
    - {url: https://api.mainnet-beta.solana.com, min_gap_sec: 2.0} # 429 after ~16 calls in 8 s; 1 per 2.5 s clean
  rpc_backoff_sec: 30
  min_gap_sec: 2
  max_polls_per_min: 10   # per wallet
  page_limit: 20
  max_pages: 3
  max_concurrent: 2

cache:
  ttl_sec:                # a yaml ttl_sec map replaces the whole default map: list every endpoint you need
    token_window_info: 30
    token_multi_info: 60
    token_security: 600     # enricher parts: repeated engine calls within minutes are free
    token_dev_info: 300
    dev_created_tokens: 1800
    token_stat: 120
    token_holder_stat: 120
    token_trader_stat: 120
    token_traders: 120
    rank_swaps: 20
    new_pairs: 20
    pump_lists: 20

copy_score:
  w_profit: 0.35
  w_winrate: 0.30
  w_positive_days: 0.20
  w_presence: 0.15
  presence_days: 7

retention:
  rank_snapshots_days: 180
  request_log_days: 30
  samples_days: 7
