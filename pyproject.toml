[project]
name = "gzetryn"
version = "0.1.0"
description = "Self-hosted GMGN web-data service (KOL/smart-money directory, wallet trade feed, token intel) for ZetrynAI"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "click>=8.5",
    "curl-cffi>=0.16.3",
    "fastapi>=0.141",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.54",
    "websockets>=15.0",
]

[project.scripts]
gzetryn = "gzetryn.cli.main:cli"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gzetryn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live: calls the real GMGN endpoints (opt-in: -m live)",
    "db: needs GZETRYN_TEST_DATABASE_URL (schema gzetryn_test)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
